services:
  postgres:
    image: postgres:16-alpine
    container_name: job-scout-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: job_scout_ai
      POSTGRES_USER: job_scout
      POSTGRES_PASSWORD: job_scout_password
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_scout -d job_scout_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: job-scout-ai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: job-scout-ai-backend
    restart: unless-stopped
    env_file:
      - backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://job_scout:job_scout_password@postgres:5432/job_scout_ai
      REDIS_URL: redis://redis:6379/0
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: ./backend
    container_name: job-scout-ai-worker
    restart: unless-stopped
    env_file:
      - backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://job_scout:job_scout_password@postgres:5432/job_scout_ai
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info

  beat:
    build:
      context: ./backend
    container_name: job-scout-ai-beat
    restart: unless-stopped
    env_file:
      - backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://job_scout:job_scout_password@postgres:5432/job_scout_ai
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app beat --loglevel=info

volumes:
  postgres-data:
